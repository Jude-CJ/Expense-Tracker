{% extends "base.html" %}
{% block title %}Reset password{% endblock %}
{% block content %}
<section class="auth-card">
  <a class="brand auth-brand" href="{{ url_for('login') }}"><span class="brand-mark">p.</span><span>Pennywise</span></a>
  <div class="eyebrow">ACCOUNT RECOVERY</div>
  <h1>Reset your password.</h1>
  <p class="muted">Enter the email address on your account. If it matches, we’ll send a secure reset link.</p>
  <form method="post" class="form-stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Email address<input name="email" type="email" autocomplete="email" maxlength="254" required autofocus></label>
    <button class="button primary full-button" type="submit">Send reset link <span>→</span></button>
  </form>
  <p class="auth-switch"><a href="{{ url_for('login') }}">Return to sign in</a></p>
</section>
{% endblock %}
