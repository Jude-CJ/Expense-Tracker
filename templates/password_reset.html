{% extends "base.html" %}
{% block title %}Choose a new password{% endblock %}
{% block content %}
<section class="auth-card">
  <a class="brand auth-brand" href="{{ url_for('login') }}"><span class="brand-mark">p.</span><span>Pennywise</span></a>
  <div class="eyebrow">ACCOUNT RECOVERY</div>
  <h1>Choose a new password.</h1>
  <p class="muted">Use at least 8 characters. This reset link can only be used once.</p>
  <form method="post" class="form-stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>New password<input name="password" type="password" autocomplete="new-password" minlength="8" maxlength="256" required autofocus></label>
    <label>Confirm new password<input name="confirm_password" type="password" autocomplete="new-password" minlength="8" maxlength="256" required></label>
    <button class="button primary full-button" type="submit">Reset password <span>→</span></button>
  </form>
</section>
{% endblock %}
